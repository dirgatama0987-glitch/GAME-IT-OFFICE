<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Virtual IT Office Simulator</title>
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="box">
    <b>Virtual IT Office Simulator</b> · Tahap 1<br />
    Lokasi: <span id="loc">Reception</span> · Kamera: <span id="cm">Third person</span>
  </div>

  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div class="btn" id="bJ">Lompat</div>
    <div class="btn" id="bV">Kamera</div>
  </div>

  <div id="ov" class="box">
    <div class="card">
      <h1>Virtual IT Office Simulator</h1>
      <p>Tahap 1: dunia 3D dan gerak karakter.</p>
      <p id="help">WASD jalan · Shift lari · Space lompat · Mouse lihat sekitar · V ganti kamera</p>
      <button id="go">Mulai</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
